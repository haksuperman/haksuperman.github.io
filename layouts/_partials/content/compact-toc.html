{{- if and .IsPage .Fragments.Headings (ne .Params.toc false) -}}
  {{- $toc := .TableOfContents -}}
  {{- if strings.Contains (string $toc) "<a " -}}
    <section class="compact-toc" aria-labelledby="compact-toc-title">
      <p class="compact-toc__title" id="compact-toc-title">{{ (T "onThisPage") | default "On this page" }}</p>
      {{ $toc }}
    </section>
  {{- end -}}
{{- end -}}
