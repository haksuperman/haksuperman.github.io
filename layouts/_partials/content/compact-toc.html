{{- if and .IsPage .Fragments.Headings (ne .Params.toc false) -}}
  {{- $toc := .TableOfContents -}}
  {{- if strings.Contains (string $toc) "<a " -}}
    <section class="compact-toc" aria-label="{{ (T "tableOfContents") | default "Table of contents" }}">
      {{ $toc }}
    </section>
  {{- end -}}
{{- end -}}
